<!-- Collapsible sidebar: early preference (no // comments — compress_html strips newlines) -->
<script>
  (function () {
    try {
      if (
        localStorage.getItem('chirpy-sidebar-collapsed') === '1' &&
        window.matchMedia('(min-width: 850px)').matches
      ) {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    } catch (e) {}
  })();
</script>
<script src="{{ '/assets/js/sidebar-toggle.js' | relative_url }}" defer></script>
